<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px;
    font: 11px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--figma-color-text, #111);
    background: var(--figma-color-bg, #fff);
  }
  .row { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; flex: 0 0 auto; }
  .dot.on { background: #17a673; }
  h3 { margin: 0 0 2px; font-size: 12px; }
  .muted { color: var(--figma-color-text-secondary, #888); }
  .box {
    margin-top: 8px; padding: 8px;
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px;
  }
  button {
    font: inherit; padding: 5px 9px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--figma-color-border, #ccc);
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: var(--figma-color-text, #111);
  }
  button.primary { background: #2b6de5; border-color: #2b6de5; color: #fff; }
  textarea {
    width: 100%; height: 90px; margin-top: 6px; resize: vertical;
    font: 10px/1.4 ui-monospace, Menlo, monospace;
    border: 1px solid var(--figma-color-border, #ccc); border-radius: 5px; padding: 5px;
    background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #111);
  }
  #log {
    margin-top: 8px; height: 96px; overflow: auto; white-space: pre-wrap;
    font: 10px/1.45 ui-monospace, Menlo, monospace;
    background: var(--figma-color-bg-secondary, #f7f7f7); border-radius: 5px; padding: 6px;
  }
</style>
</head>
<body>
  <h3>FIMG Agent Plugin</h3>
  <div class="row"><span class="dot" id="dot"></span><span id="state" class="muted">正在连接本地桥…</span></div>

  <div class="box">
    <div class="row" style="justify-content:space-between">
      <span class="muted">本地桥</span><span id="addr">localhost:8787</span>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="reconnect">重连</button>
      <button id="ping">握手</button>
    </div>
  </div>

  <div class="box">
    <div class="muted">离线兜底：粘贴规格 JSON 追加渲染到当前页</div>
    <textarea id="manual" placeholder='{"frames":[…]}'></textarea>
    <div class="row" style="margin-top:6px">
      <button class="primary" id="renderManual">本地渲染</button>
      <button id="clear">清空页面</button>
    </div>
  </div>

  <div id="log"></div>

<script>
const BRIDGE = 'http://localhost:8787';
const logEl = document.getElementById('log');
const dot = document.getElementById('dot');
const stateEl = document.getElementById('state');

let polling = false;
let alive = true;

function log(msg) {
  const t = new Date().toTimeString().slice(0, 8);
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setOnline(on, text) {
  dot.classList.toggle('on', on);
  stateEl.textContent = text || (on ? '已连接 · 待命' : '未连接');
}

async function post(path, body) {
  const r = await fetch(BRIDGE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

/* 把指令交给主线程执行，等主线程 postMessage 回来 */
const waiters = new Map();
window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  // 渲染进度：转发给桥，便于外部观察长任务
  if (msg.type === 'progress') {
    log(`… ${msg.cmd} 已创建 ${msg.done} 个节点`);
    post('/progress', { done: msg.done, cmd: msg.cmd }).catch(() => {});
    return;
  }
  const w = waiters.get(msg.id);
  if (w) { waiters.delete(msg.id); w(msg); }
};

/**
 * 关键：必须带超时。
 * 主线程只要因任何原因不回消息（渲染过慢、抛了 catch 不到的错误、被 Figma 中断），
 * 没有超时的 promise 会让整个轮询循环永久挂死 —— 既不再取指令，也不上报结果。
 */
function run(cmd, payload, timeoutMs = 600000) {
  return new Promise((resolve) => {
    const id = 'ui' + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => {
      waiters.delete(id);
      log(`✖ ${cmd} 主线程 ${Math.round(timeoutMs / 1000)}s 未响应，放弃等待`);
      resolve({ ok: false, error: `主线程 ${Math.round(timeoutMs / 1000)}s 未响应` });
    }, timeoutMs);
    waiters.set(id, (m) => { clearTimeout(timer); resolve(m); });
    parent.postMessage({ pluginMessage: { id, cmd, payload } }, '*');
  });
}

async function loop() {
  if (polling) return;
  polling = true;
  while (alive) {
    try {
      const res = await fetch(BRIDGE + '/next', { cache: 'no-store' });
      if (res.status === 204) { setOnline(true); continue; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const env = await res.json();
      setOnline(true, '执行中 · ' + env.cmd);
      log('▶ ' + env.cmd + ' ' + env.id);
      const out = await run(env.cmd, env.payload);
      log((out && out.ok ? '✔ ' : '✖ ') + env.cmd + (out && out.error ? ' — ' + out.error : ''));
      await post('/result', { id: env.id, ok: !!(out && out.ok), data: out && out.data, error: out && out.error });
    } catch (e) {
      setOnline(false, '等待本地桥…');
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}

document.getElementById('reconnect').onclick = () => { log('手动重连'); setOnline(false, '重连中…'); };
document.getElementById('ping').onclick = async () => {
  const out = await run('ping', {});
  log('handshake: ' + JSON.stringify(out && out.data || out));
};

document.getElementById('renderManual').onclick = async () => {
  const raw = document.getElementById('manual').value.trim();
  if (!raw) return log('先粘贴 JSON');
  let spec;
  try { spec = JSON.parse(raw); } catch (e) { return log('JSON 解析失败: ' + e.message); }
  log('本地渲染…');
  // 不传 pageName → 渲染到「当前页」；不传 clear → 追加，绝不清空现有内容。
  // 想清空请用下面的「清空页面」按钮（它有二次确认）。
  const out = await run('render', { spec });
  log(out && out.ok ? '✔ 渲染完成 ' + JSON.stringify(out.data) : '✖ ' + (out && out.error));
};

document.getElementById('clear').onclick = async () => {
  // 现在清空的是「用户当前正在看的那一页」，必须有二次确认。
  if (!confirm('确定清空 Figma 的当前页面？此操作会删除该页所有节点（可用 ⌘Z 撤销）。')) {
    return log('已取消清空');
  }
  const out = await run('clear', {});
  log(out && out.ok ? '✔ 已清空' : '✖ ' + (out && out.error));
};

/* 启动时握一次手，把插件信息登记到桥上 */
(async () => {
  let info = null;
  try {
    const out = await run('ping', {});
    info = out && out.data;
    log('plugin up: ' + JSON.stringify(info || {}));
  } catch (e) { log('ping failed: ' + e.message); }
  try {
    await post('/hello', { info });
  } catch (e) { /* 桥没起来就算了，loop 会重试 */ }
  loop();
})();
</script>
</body>
</html>
